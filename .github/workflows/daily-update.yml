name: Daily Viral Angle Radar

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      fixture:
        description: "Run with demo fixture data"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: viral-angle-radar-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LIVE_PROVIDER_URL: ${{ secrets.LIVE_PROVIDER_URL }}
      LIVE_PROVIDER_TOKEN: ${{ secrets.LIVE_PROVIDER_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RADAR_DASHBOARD_URL: https://taogiangmyvn-ux.github.io/viral-angle-radar/
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore trend comparison baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            data/trend_baseline.json
            data/radar.db
            data/creator_candidates.generated.json
            data/trending_sounds.generated.json
            data/scout_status.json
          key: viral-format-baseline-${{ github.run_id }}
          restore-keys: |
            viral-format-baseline-
      - name: Install Excel fallback
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Scout TikTok search and creator profiles
        if: ${{ env.APIFY_TOKEN != '' }}
        run: python -m viral_radar daily --scout
      - name: Build daily outputs from configured provider
        if: ${{ env.APIFY_TOKEN == '' && env.LIVE_PROVIDER_URL != '' }}
        run: python -m viral_radar daily --live
      - name: Build manual library and show disconnected scout status
        if: ${{ env.APIFY_TOKEN == '' && env.LIVE_PROVIDER_URL == '' }}
        run: python -m viral_radar daily
      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: viral-angle-radar-excel
          path: outputs/viral-angle-radar.xlsx
      - name: Save trend comparison baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/trend_baseline.json
            data/radar.db
            data/creator_candidates.generated.json
            data/trending_sounds.generated.json
            data/scout_status.json
          key: viral-format-baseline-${{ github.run_id }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
